# Set update schedule for GitHub Actions
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/tests/node"
    schedule:
      interval: "weekly"
    groups:
      node-test-tools:
        patterns: ["*"]
