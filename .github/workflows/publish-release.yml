name: Publish Release

on:
  workflow_call:

jobs:
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: |
          wasm-pack build --scope bitcoindevkit --target bundler --out-dir pkg-web --features "esplora" --locked
          cd pkg-web
          jq '.name = "@bitcoindevkit/bdk-wallet-web"' package.json > temp.json && mv temp.json package.json
          cd ..
          wasm-pack build --scope bitcoindevkit --target nodejs --out-dir pkg-node --all-features --locked
          cd pkg-node
          jq '.name = "@bitcoindevkit/bdk-wallet-node"' package.json > temp.json && mv temp.json package.json
          cd ..
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./pkg-web
          key: ${{ github.sha }}-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./pkg-node
          key: ${{ github.sha }}-node

  publish-npm-dry-run-web:
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./pkg-web
          key: ${{ github.sha }}-web
          fail-on-cache-miss: true
      - name: Dry Run Publish
        working-directory: pkg-web
        run: npm publish --dry-run

  publish-npm-dry-run-node:
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./pkg-node
          key: ${{ github.sha }}-node
          fail-on-cache-miss: true
      - name: Dry Run Publish
        working-directory: pkg-node
        run: npm publish --dry-run

  publish-npm:
    environment: npm-publish
    runs-on: ubuntu-latest
    needs: [publish-npm-dry-run-web, publish-npm-dry-run-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./pkg-web
          key: ${{ github.sha }}-web
          fail-on-cache-miss: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./pkg-node
          key: ${{ github.sha }}-node
          fail-on-cache-miss: true
      - name: Publish web
        working-directory: pkg-web
        run: npm publish --access=public --provenance
        env:
          SKIP_PREPACK: true
      - name: Publish node
        working-directory: pkg-node
        run: npm publish --access=public --provenance
        env:
          SKIP_PREPACK: true
