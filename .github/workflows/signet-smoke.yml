name: Signet Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signet-smoke-test:
    name: Read-only signet smoke test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: tests/node/yarn.lock
      - name: Install dependencies
        working-directory: tests/node
        run: yarn install --immutable
      - name: Build WASM (Node target)
        working-directory: tests/node
        run: yarn build
      - name: Scan an unfunded wallet on Mutinynet
        working-directory: tests/node
        run: yarn test:signet
