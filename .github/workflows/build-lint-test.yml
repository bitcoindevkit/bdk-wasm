name: Build, Lint, and Test

on:
  workflow_call:

jobs:
  build-test:
    name: Build and test - Browser
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - all
          - debug,default
          - debug,esplora
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            wasm-pack build --all-features --locked
          else
            wasm-pack build --features ${{ matrix.features }} --locked
          fi
      - name: Test
        if: ${{ matrix.features != 'all' }}
        run: wasm-pack test --chrome --firefox --headless --features ${{ matrix.features }} --locked

  build-lint-test-node:
    name: Build, Lint and test - Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: tests/node/yarn.lock
      - name: Install
        working-directory: tests/node
        run: yarn install --immutable
      - name: Lint
        working-directory: tests/node
        run: yarn lint
      - name: Test
        working-directory: tests/node
        run: yarn build && yarn typecheck && yarn jest --testPathIgnorePatterns='integration/(esplora|events)'

  esplora-integration:
    name: Esplora integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: tests/node/yarn.lock
      - name: Install dependencies
        working-directory: tests/node
        run: yarn install --immutable
      - name: Build WASM (Node target)
        working-directory: tests/node
        run: yarn build
      - name: Start Esplora regtest
        run: docker compose -f tests/docker-compose.yml up -d
      - name: Wait for Esplora
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8094/regtest/api/blocks/tip/height > /dev/null 2>&1; then
              echo "Esplora is ready"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 3
          done
          echo "Esplora did not start in time"
          docker compose -f tests/docker-compose.yml logs
          exit 1
      - name: Fund test wallet
        run: docker exec esplora-regtest bash /init-esplora.sh
      - name: Wait for Esplora indexing
        run: sleep 10
      - name: Run Esplora integration tests
        working-directory: tests/node
        run: NETWORK=regtest ESPLORA_URL=http://localhost:8094/regtest/api yarn jest --runInBand --testPathPatterns='integration/(esplora|events)'
      - name: Stop Esplora
        if: always()
        run: docker compose -f tests/docker-compose.yml down

  signet-smoke-test:
    name: Signet smoke test (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: tests/node/yarn.lock
      - name: Install dependencies
        working-directory: tests/node
        run: yarn install --immutable
      - name: Build WASM (Node target)
        working-directory: tests/node
        run: yarn build
      - name: Run Mutinynet signet tests
        working-directory: tests/node
        run: yarn jest --testPathPatterns='integration/esplora'

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --config format_code_in_doc_comments=true --check
      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --all-features --all-targets
      - run: cargo check --locked --all-features --target wasm32-unknown-unknown

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: tests/node/yarn.lock
      - run: yarn install --immutable
        working-directory: tests/node
      - run: yarn npm audit --all --recursive
        working-directory: tests/node
